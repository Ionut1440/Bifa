# XcodeGen spec — GitHub Actions turns this into Bifa.xcodeproj (no Mac needed locally).
name: Bifa
options:
  bundleIdPrefix: com.ionut
  developmentLanguage: ro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Bifa:
    type: application
    platform: iOS
    sources:
      - path: Bifa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ionut.bifa
        PRODUCT_NAME: Bifa
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Bifă"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    scheme: {}
