<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
  <script>try{var t=localStorage.getItem("mindme.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Concediu">

<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Concediu</title>
<style>
  /* ---------- MindMe design tokens (identice cu style.css din MindMe) ---------- */
  :root {
    --bg: #F2F2F7; --card: #FFFFFF; --card2: #F7F7FA; --text: #111114; --muted: #8A8A93;
    --line: rgba(60, 60, 67, .14); --accent: #7C5CFA; --red: #EB4240; --green: #2EB87A; --orange: #FF8C40;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
    --jos: 110px;   /* MindMe's glass bar floats over the last ~100px */
    --segpill: #FFFFFF; --segbg: rgba(118,118,128,.14); --track: #EFEFF4;
    /* nume vechi, folosite și în HTML-ul generat din script */
    --indigo: var(--accent); --violet: #9961F2; --text2: var(--muted); --fundal: var(--bg); --linie: var(--line);
    --coral: #FF7A59; --galben: #FFC94D;
    --co: #14B8A6; --co-trecut: #94D3CC; --sarb: #F43F5E; --sarb-bg: #FFE4E9; --we-bg: #ECECF1; --we: #8A8A93;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) {
      --bg: #000000; --card: #1C1C1E; --card2: #2C2C2E; --text: #F4F4F6; --muted: #8E8E96;
      --line: rgba(255, 255, 255, .12); --shadow: none; --segpill: #636366; --segbg: rgba(118,118,128,.24); --track: #2C2C2E;
      --co-trecut: #2F7F77; --sarb-bg: rgba(244, 63, 94, .2); --we-bg: #2C2C2E; --we: #8E8E96;
      color-scheme: dark;
    }
}
:root[data-theme="dark"] {
      --bg: #000000; --card: #1C1C1E; --card2: #2C2C2E; --text: #F4F4F6; --muted: #8E8E96;
      --line: rgba(255, 255, 255, .12); --shadow: none; --segpill: #636366; --segbg: rgba(118,118,128,.24); --track: #2C2C2E;
      --co-trecut: #2F7F77; --sarb-bg: rgba(244, 63, 94, .2); --we-bg: #2C2C2E; --we: #8E8E96;
      color-scheme: dark;
    }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  body { font-size: 16px; line-height: 1.3; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; overflow-x: hidden;
    /* fără selecție de text / meniu de copiere, în afară de câmpuri */
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea, select { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; font: inherit; font-size: max(16px, 1em); color: var(--text); }
  img { -webkit-user-drag: none; pointer-events: none; }
  button { font: inherit; cursor: pointer; color: inherit; background: none; border: 0; padding: 0;
    -webkit-user-select: none; user-select: none; transition: transform .15s ease, background .2s, color .2s; }
  button:active { transform: scale(.95); }
  [hidden] { display: none !important; }

  main { max-width: 560px; margin: 0 auto; padding: calc(var(--safe-t) + 8px) 16px calc(var(--jos) + var(--safe-b)); }

  /* ---------- secțiunile = control segmentat MindMe (bulă care alunecă, se trage cu degetul, lupă) ---------- */
  .seg { position: relative; display: flex; background: var(--segbg); border-radius: 10px; padding: 2px; margin: 0;
    touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  .seg > button { flex: 1; position: relative; z-index: 1; padding: 7px 0; font-size: 14px; font-weight: 600; border-radius: 8px;
    color: var(--text); background: transparent !important; box-shadow: none !important; transition: transform .2s cubic-bezier(.3,1.4,.5,1); }
  .seg > button:active { transform: none; }
  .seg > button.over { transform: scale(1.06); }
  .seg.dragging > button { transition: transform .09s linear, color .2s; }
  .segpill { position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; border-radius: 8px; background: var(--segpill);
    box-shadow: 0 1px 4px rgba(0,0,0,.14); z-index: 0; pointer-events: none;
    transition: transform .36s cubic-bezier(.3,1.3,.5,1), width .25s ease, top .2s, bottom .2s; }
  .seg.dragging .segpill { transition: width .2s ease, top .2s, bottom .2s; top: 0; bottom: 0; box-shadow: 0 3px 10px rgba(0,0,0,.18); }
  .seg.noanim .segpill { transition: none; }

  /* ---------- sus: azi + sold rapid (fără titlu — MindMe afișează titlul deasupra) ---------- */
  .hero { margin-top: 14px; }
  .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 0 4px 8px; }
  .hero p { margin: 0; color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px;
    min-width: 0; overflow-wrap: break-word; }
  .an-pill { flex: 0 0 auto; border-radius: 10px; padding: 6px 11px; font-weight: 700; font-size: 14px;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .rezumat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rezumat div { --tc: var(--accent); position: relative; border-radius: 14px; padding: 12px 12px 11px;
    background: color-mix(in srgb, var(--tc) 13%, var(--card)); min-width: 0; }
  .rezumat div + div { --tc: var(--co); }
  .rezumat div::after { content: "🏖️"; position: absolute; top: 10px; right: 11px; font-size: 18px; line-height: 1; }
  .rezumat div + div::after { content: "🗓️"; }
  .rezumat b { display: block; font-size: 28px; line-height: 1.05; font-weight: 800; letter-spacing: -.5px; font-variant-numeric: tabular-nums; color: var(--text); }
  .rezumat small { display: block; margin-top: 3px; font-size: 12px; font-weight: 700; color: var(--tc); }

  /* ---------- carduri și titluri de secțiune ---------- */
  .sec-title { font-size: 13px; font-weight: 600; text-transform: uppercase; color: var(--muted); letter-spacing: .3px; margin: 22px 4px 7px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card h2 { margin: 0; font-size: 20px; font-weight: 800; }
  .rand { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .eticheta { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .3px; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .badge.viitor { background: color-mix(in srgb, var(--coral) 15%, transparent); color: var(--coral); }

  /* intrare lină la schimbarea secțiunii (ca slIn din MindMe) */
  @keyframes slIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  section.intra > * { animation: slIn .34s cubic-bezier(.2,.9,.3,1) both; }
  section.intra > :nth-child(2) { animation-delay: 45ms; }
  section.intra > :nth-child(3) { animation-delay: 90ms; }
  section.intra > :nth-child(4) { animation-delay: 135ms; }
  section.intra > :nth-child(n+5) { animation-delay: 180ms; }

  /* ---------- Sold ---------- */
  .donut { display: flex; align-items: center; gap: 18px; margin: 2px 0 10px; }
  .donut svg { flex: 0 0 120px; }
  .donut svg > circle:first-of-type { stroke: var(--track); }
  .donut .centru { font-size: 30px; font-weight: 800; fill: var(--text); }
  .donut .sub { font-size: 9px; fill: var(--muted); font-weight: 700; letter-spacing: .3px; }
  .leg { display: grid; gap: 8px; font-size: 15px; flex: 1; min-width: 0; }
  .leg span { display: flex; align-items: center; gap: 8px; }
  .leg i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  .leg b { margin-left: auto; font-variant-numeric: tabular-nums; }

  .setare { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: .5px solid var(--line); font-size: 15px; }
  .setare:last-child { padding-bottom: 0; }
  .setare small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .stepper { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .stepper button { width: 34px; height: 34px; border-radius: 17px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: 20px; font-weight: 700; display: grid; place-items: center; line-height: 1; }
  .stepper button:active { transform: scale(.88); }
  .stepper b { min-width: 32px; text-align: center; font-size: 17px; font-variant-numeric: tabular-nums; }
  /* întrerupător — mărimea standard iPhone (ca .sw din MindMe) */
  .comutator { flex: 0 0 auto; width: 51px; height: 31px; border-radius: 31px; background: rgba(120,120,128,.24); position: relative; transition: background .2s; }
  .comutator:active { transform: none; }
  .comutator::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 5px rgba(0,0,0,.2); }
  .comutator.on { background: var(--green); }
  .comutator.on::after { transform: translateX(20px); }
  .nota { font-size: 13px; color: var(--muted); line-height: 1.45; margin-top: 8px; }
  .nota b { color: var(--text); }
  .nota.justificat { text-align: justify; hyphens: none; -webkit-hyphens: none; }
  .avert { margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--sarb);
    background: color-mix(in srgb, var(--sarb) 12%, var(--card)); }

  .perioada { padding: 8px 0 8px 12px; margin: 4px 0; border-left: 4px solid var(--co); border-radius: 2px; }
  .perioada:first-child { margin-top: 0; }
  .perioada:last-child { margin-bottom: 0; }
  .perioada + .perioada { margin-top: 10px; }
  /* fiecare rând stă pe o singură linie; potrivesteRanduri() micșorează fontul dacă nu încape */
  .perioada b, .perioada small { display: block; white-space: nowrap; overflow: hidden; }
  .perioada b { font-size: 15px; font-weight: 600; }
  .perioada small { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .gol { color: var(--muted); font-size: 14px; padding: 6px 0; }
  .card.gol { padding: 18px 14px; text-align: center; font-size: 15px; }
  .gol-frumos { text-align: center; padding: 10px 4px 4px; color: var(--muted); }
  .gol-frumos .ico-mare { font-size: 46px; line-height: 1.1; }
  .gol-frumos b { display: block; color: var(--text); font-size: 18px; margin: 8px 0 4px; }
  .gol-frumos p { margin: 0 0 14px; font-size: 15px; color: var(--muted); line-height: 1.45; text-wrap: balance; }
  .gol-frumos .chipuri { justify-content: center; margin: 0; flex-wrap: wrap; }
  .gol-frumos .chip { padding: 9px 14px; border-radius: 12px; font-size: 14px; font-weight: 700;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .gol-frumos .chip.activ { background: var(--accent); color: #fff; }

  /* ---------- Calendar ---------- */
  .cal-cap { display: flex; align-items: center; gap: 6px; }
  .cal-cap .titlu { flex: 1; min-width: 0; text-align: center; font-size: 17px; white-space: nowrap; font-weight: 700; color: var(--text); padding: 8px 4px; border-radius: 10px; }
  .cal-cap .titlu::after { content: " ▾"; color: var(--accent); font-size: 13px; }
  .rotund { width: 36px; height: 36px; flex: 0 0 auto; border-radius: 18px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); font-size: 22px; font-weight: 700; line-height: 1; display: grid; place-items: center; padding-bottom: 2px; }
  .rotund:active { transform: scale(.88); }
  .buton-azi { flex: 0 0 auto; background: var(--accent); color: #fff; border-radius: 10px; padding: 0 12px; height: 34px; font-weight: 700; font-size: 14px; }
  .grila { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; touch-action: pan-y; }
  .grila.din-dreapta { animation: dinDreapta .28s cubic-bezier(.2,.9,.3,1); }
  .grila.din-stanga { animation: dinStanga .28s cubic-bezier(.2,.9,.3,1); }
  @keyframes dinDreapta { from { opacity: 0; transform: translateX(26px); } }
  @keyframes dinStanga { from { opacity: 0; transform: translateX(-26px); } }
  .grila .cap { text-align: center; font-size: 9.5px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap; color: var(--muted); padding: 2px 0 4px; }
  .zi { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;
    border-radius: 50%; background: transparent; user-select: none; position: relative; cursor: pointer; font-variant-numeric: tabular-nums;
    transition: transform .15s, background .15s, color .15s; }
  .zi:not(.goala):active { transform: scale(.88); }
  .zi:not(.goala):not(.co):not(.sarb):active { background: var(--card2); }
  .zi.goala { cursor: default; }
  .zi.we { color: var(--we); font-weight: 500; }
  .zi.sarb { background: var(--sarb-bg); color: var(--sarb); font-weight: 700; }
  .zi.co { background: var(--co); color: #fff; font-weight: 700; }
  .zi.co.trecut { background: var(--co-trecut); }
  .zi.azi { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); font-weight: 800; }
  .zi.co.azi { color: #fff; }
  .zi.sarb::after { content: ""; position: absolute; bottom: 5px; width: 4px; height: 4px; border-radius: 50%; background: var(--sarb); }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .legenda span { display: flex; align-items: center; gap: 6px; }
  .legenda i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .info { margin-top: 12px; font-size: 14px; line-height: 1.4; color: var(--text); background: color-mix(in srgb, var(--accent) 10%, var(--card)); border-radius: 12px; padding: 10px 12px; min-height: 40px; }
  .info:empty { display: none; }
  .sarb-lista { margin: -2px 0; }
  .sarb-lista div { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: .5px solid var(--line); font-size: 15px; }
  .sarb-lista div:first-child { border-top: 0; }
  .sarb-lista span { color: var(--sarb); font-weight: 700; white-space: nowrap; }
  .card:has(> .sarb-lista) { padding-top: 10px; padding-bottom: 10px; }

  /* ---------- Idei ---------- */
  .chipuri { display: flex; gap: 8px; margin-bottom: 12px; }
  .chip { padding: 7px 14px; border-radius: 20px; font-weight: 600; font-size: 14px; background: var(--card); color: var(--text); }
  .chipuri.seg { margin: 14px 0 12px; gap: 0; }
  .chipuri.seg > .chip { padding: 7px 0; border-radius: 8px; font-size: 14px; }
  .nota-idei { margin: 0; padding: 11px 13px; border-radius: 14px; font-size: 14px; line-height: 1.45; color: var(--text);
    background: color-mix(in srgb, var(--accent) 10%, var(--card)); }
  .nota-idei .nota { margin: 0; font-size: 14px; color: color-mix(in srgb, var(--text) 78%, transparent); }

  .idee { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .idee-titlu { font-weight: 700; font-size: 16px; }
  .idee-per { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .castig { --tc: var(--coral); flex: 0 0 auto; text-align: center; background: color-mix(in srgb, var(--tc) 14%, var(--card)); color: var(--tc); border-radius: 12px; padding: 6px 10px; min-width: 66px; }
  .castig b { display: block; font-size: 22px; line-height: 1.1; font-weight: 800; font-variant-numeric: tabular-nums; }
  .castig small { font-size: 10px; font-weight: 700; }
  .idee.zero .castig { --tc: #E0A000; }
  .idee.planificat .castig { --tc: var(--co); }
  .idee.planificat { box-shadow: var(--shadow), inset 0 0 0 1.5px color-mix(in srgb, var(--co) 55%, transparent); }
  .banda { display: flex; gap: 3px; margin: 12px 0 10px; }
  .banda div { flex: 1; text-align: center; font-size: 10px; font-weight: 700; padding: 6px 0; border-radius: 8px; min-width: 0; line-height: 1.25; }
  .banda .b-we { background: var(--we-bg); color: var(--we); }
  .banda .b-sarb { background: var(--sarb-bg); color: var(--sarb); }
  .banda .b-co { background: var(--co); color: #fff; }
  .idee-jos { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); line-height: 1.4; }
  .idee-jos b { color: var(--text); }
  .idee-jos button { flex: 0 0 auto; border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 14px; background: var(--accent); color: #fff; }
  .idee.planificat .idee-jos button { background: color-mix(in srgb, var(--co) 15%, transparent); color: var(--co); }

  /* ---------- fereastra de jos (alegere lună / an) = bottom sheet MindMe ---------- */
  .fundal-sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: flex-end; justify-content: center;
    animation: fade .2s; touch-action: none; overscroll-behavior: contain; }
  .sheet { background: var(--bg); width: 100%; max-width: 560px; border-radius: 14px 14px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.12);
    padding: 6px 0 calc(24px + var(--safe-b)); animation: up .28s cubic-bezier(.2,.9,.3,1); }
  html.inmm .sheet { padding-bottom: calc(var(--jos) + var(--safe-b)); }   /* în MindMe: deasupra barei plutitoare */
  .fundal-sheet.pleaca { animation: fadeOut .22s ease forwards; }
  .fundal-sheet.pleaca .sheet { animation: down .22s cubic-bezier(.4,0,.8,.4) forwards; }
  @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes down { to { transform: translateY(100%); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }
  .maner { width: 36px; height: 5px; border-radius: 3px; background: rgba(120,120,128,.35); margin: 0 auto 2px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 6px; gap: 8px; }
  .panel-head .t { font-weight: 700; font-size: 17px; text-align: center; flex: 1; overflow-wrap: break-word; line-height: 1.2; }
  .panel-head button { color: var(--accent); font-size: 17px; min-width: 70px; text-align: left; padding: 6px 0; }
  .panel-head button.save { font-weight: 700; text-align: right; }
  .sheet-body { padding: 4px 16px 0; }
  .an-nav { display: flex; align-items: center; justify-content: space-between; background: var(--card); border-radius: 14px; padding: 8px; box-shadow: var(--shadow); }
  .an-nav h3 { margin: 0; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .luni { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0 14px; }
  .luni.din-dreapta { animation: dinDreapta .26s cubic-bezier(.2,.9,.3,1); }
  .luni.din-stanga { animation: dinStanga .26s cubic-bezier(.2,.9,.3,1); }
  .luni button { background: var(--card); box-shadow: var(--shadow); border-radius: 12px; padding: 14px 0; font-size: 15px; font-weight: 600; color: var(--text); position: relative; }
  .luni button.sel { background: var(--accent); color: #fff; }
  .luni button.curenta:not(.sel) { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); }
  .luni button em { position: absolute; top: 5px; right: 7px; font-style: normal; font-size: 10px; font-weight: 700; background: var(--co); color: #fff; border-radius: 999px; padding: 1px 6px; }
  .buton-mare { width: 100%; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 700;
    background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }

  /* mesaj scurt: deasupra barei plutitoare din MindMe */
  .toast { position: fixed; left: 50%; bottom: calc(var(--jos) + var(--safe-b)); transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 11px 18px; border-radius: 22px; font-size: 14px; font-weight: 600; text-align: center; z-index: 30; width: max-content; max-width: calc(100% - 32px);
    box-shadow: 0 6px 20px rgba(0,0,0,.2); animation: urcaToast .28s cubic-bezier(.2,.9,.3,1); }
  @keyframes urcaToast { from { transform: translate(-50%, 24px); opacity: 0; } }
</style>
</head>
<body>
<main>
  <div class="seg" id="segTab" role="tablist">

      <div class="an-nav">
        <button class="rotund" id="pickInapoi" aria-label="Anul anterior">‹</button>
        <h3 id="pickAn"></h3>
        <button class="rotund" id="pickInainte" aria-label="Anul următor">›</button>

      <div class="luni" id="pickLuni"></div>
      <button class="buton-mare" id="pickAzi">Înapoi la azi</button>
    </div>

</div>

<script>
"use strict";
// deschisă în MindMe (iframe)? atunci bara plutitoare MindMe stă peste partea de jos
try { if (window.top !== window.self) document.documentElement.classList.add("inmm"); } catch (e) { document.documentElement.classList.add("inmm"); }

// ---------- date calendaristice (UTC, fără probleme de oră de vară)
const LUNI = ["Ianuarie","Februarie","Martie","Aprilie","Mai","Iunie","Iulie","August","Septembrie","Octombrie","Noiembrie","Decembrie"];
const LUNI_SCURT = ["ianuarie","februarie","martie","aprilie","mai","iunie","iulie","august","septembrie","octombrie","noiembrie","decembrie"];   // full names: no abbreviations
const ZS = ["Duminică","Luni","Marți","Miercuri","Joi","Vineri","Sâmbătă"];
const ZILE_LUNG = ["duminică","luni","marți","miercuri","joi","vineri","sâmbătă"];
const ZI_MS = 864e5;
const D = (y, m, d) => new Date(Date.UTC(y, m - 1, d));
const adauga = (d, n) => new Date(d.getTime() + n * ZI_MS);
const cheie = d => d.toISOString().slice(0, 10);
const dinCheie = k => D(+k.slice(0, 4), +k.slice(5, 7), +k.slice(8, 10));
const _acum = new Date();
const AZI = D(_acum.getFullYear(), _acum.getMonth() + 1, _acum.getDate());
const K_AZI = cheie(AZI);
const AN_AZI = AZI.getUTCFullYear();
const fmt = d => `${ZS[d.getUTCDay()].toLowerCase()}, ${d.getUTCDate()} ${LUNI_SCURT[d.getUTCMonth()]}`;
// „Joi, 19 noiembrie”
const fmtLung = d => { const z = ZILE_LUNG[d.getUTCDay()]; return `${z[0].toUpperCase() + z.slice(1)}, ${d.getUTCDate()} ${LUNI[d.getUTCMonth()].toLowerCase()}`; };
const zile = n => n === 1 ? "1 zi" : `${n} zile`;

// ---------- sărbători legale România (Codul muncii, art. 139)
function pasteOrtodox(an) {
  const a = an % 4, b = an % 7, c = an % 19;
  const d = (19 * c + 15) % 30, e = (2 * a + 4 * b - d + 34) % 7;
  return adauga(D(an, Math.floor((d + e + 114) / 31), (d + e + 114) % 31 + 1), 13);
}
const _sarb = {};
function sarbatori(an) {
  if (_sarb[an]) return _sarb[an];
  const z = {};
  const pune = (d, nume) => { const k = cheie(d); z[k] = z[k] ? z[k] + " / " + nume : nume; };
  pune(D(an, 1, 1), "Anul Nou"); pune(D(an, 1, 2), "Anul Nou");
  if (an >= 2024) { pune(D(an, 1, 6), "Boboteaza"); pune(D(an, 1, 7), "Sf. Ioan"); }
  pune(D(an, 1, 24), "Ziua Unirii"); pune(D(an, 5, 1), "Ziua Muncii"); pune(D(an, 6, 1), "Ziua Copilului");
  pune(D(an, 8, 15), "Sfânta Maria"); pune(D(an, 11, 30), "Sf. Andrei"); pune(D(an, 12, 1), "Ziua Națională");
  pune(D(an, 12, 25), "Crăciunul"); pune(D(an, 12, 26), "Crăciunul");
  const p = pasteOrtodox(an);
  for (const [delta, nume] of [[-2, "Vinerea Mare"], [0, "Paștele"], [1, "Paștele"], [49, "Rusaliile"], [50, "Rusaliile"]]) pune(adauga(p, delta), nume);
  return (_sarb[an] = z);
}
const numeSarb = k => sarbatori(+k.slice(0, 4))[k];
const weekend = d => { const w = d.getUTCDay(); return w === 0 || w === 6; };
const liber = d => weekend(d) || !!numeSarb(cheie(d));

// ---------- date salvate
const CHEIE = "zileConcediu.date";
function incarca() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(CHEIE)); } catch (e) { d = null; }
  if (!d) {   // prima pornire: anul curent cu 5 zile rămase (21 alocate, 16 luate)
    d = { ani: {}, zile: {} };
    d.ani[AN_AZI] = { alocate: 21, luateInainte: 16, report: false };
  }
  d.ani = d.ani || {}; d.zile = d.zile || {};
  for (const an of [AN_AZI, AN_AZI + 1]) if (!d.ani[an]) d.ani[an] = { alocate: 21, luateInainte: 0, report: true };
  return d;
}
const date = incarca();
function salveaza() {
  try { localStorage.setItem(CHEIE, JSON.stringify(date)); } catch (e) { toast("Eroare la salvare: " + e.message); }
}

function sold(an, adancime = 0) {
  const c = date.ani[an];
  if (!c) return null;
  let luate = 0, plan = 0;
  for (const k in date.zile) if (+k.slice(0, 4) === an) { if (k <= K_AZI) luate++; else plan++; }
  const prec = c.report && adancime < 10 ? sold(an - 1, adancime + 1) : null;
  const report = prec ? Math.max(0, prec.ramase) : 0;
  const total = c.alocate + report;
  return { total, report, alocate: c.alocate, inainte: c.luateInainte, luate, plan,
           ramase: total - c.luateInainte - luate - plan, folosite: c.luateInainte + luate };
}

// ---------- idei de concediu: extinde fiecare bloc liber din jurul sărbătorilor
// pentru fiecare bloc: varianta fără concediu, cea mai eficientă și cea mai lungă (max. 5 zile CO)
function idei(an) {
  const rez = [], vazute = new Set(), blocuri = new Set();
  for (const hk of Object.keys(sarbatori(an)).sort()) {
    const h = dinCheie(hk);
    if (weekend(h)) continue;
    let s = h, e = h;
    while (liber(adauga(s, -1))) s = adauga(s, -1);
    while (liber(adauga(e, 1))) e = adauga(e, 1);
    if (blocuri.has(cheie(s))) continue;
    blocuri.add(cheie(s));
    const variante = [{ s, e, co: [] }];
    for (let L = 0; L <= 4; L++) for (let R = 0; R <= 4; R++) {
      if (L + R < 1 || L + R > 5) continue;
      let a = s, b = e; const co = [];
      for (let i = 0; i < L; i++) { a = adauga(a, -1); co.push(cheie(a)); while (liber(adauga(a, -1))) a = adauga(a, -1); }
      for (let i = 0; i < R; i++) { b = adauga(b, 1); co.push(cheie(b)); while (liber(adauga(b, 1))) b = adauga(b, 1); }
      variante.push({ s: a, e: b, co: co.sort() });
    }
    const valide = [];
    for (const v of variante) {
      v.total = Math.round((v.e - v.s) / ZI_MS) + 1;
      if (v.co.some(k => k <= K_AZI) || v.e < AZI) continue;   // nu propunem zile din trecut
      if (v.co.length === 0 ? v.total >= 3 : v.total >= 4 && v.total / v.co.length >= 2) valide.push(v);
    }
    const alese = [];
    const zero = valide.find(v => !v.co.length);
    if (zero) alese.push(zero);
    const cuCo = valide.filter(v => v.co.length);
    const ef = v => v.total / v.co.length;
    const eficienta = cuCo.slice().sort((a, b) => ef(b) - ef(a) || a.co.length - b.co.length || a.s - b.s)[0];
    const lunga = cuCo.slice().sort((a, b) => b.total - a.total || a.co.length - b.co.length || a.s - b.s)[0];
    if (eficienta) alese.push(eficienta);
    if (lunga && lunga !== eficienta && lunga.total > eficienta.total) alese.push(lunga);
    for (const v of alese) {
      const id = v.co.join() || cheie(v.s);
      if (vazute.has(id)) continue;
      vazute.add(id);
      const nume = [];
      for (let d = v.s; d <= v.e; d = adauga(d, 1)) { const n = numeSarb(cheie(d)); if (n && !nume.includes(n)) nume.push(n); }
      rez.push(Object.assign(v, { nume, bloc: s }));
    }
  }
  return rez.sort((x, y) => x.bloc - y.bloc || x.co.length - y.co.length);
}

// „26, 27 noi · 2, 3, 4 dec”
function listaZile(chei) {
  const grupuri = [];
  for (const k of chei) {
    const d = dinCheie(k), eticheta = LUNI_SCURT[d.getUTCMonth()], g = grupuri[grupuri.length - 1];
    if (g && g.luna === eticheta) g.zile.push(d.getUTCDate()); else grupuri.push({ luna: eticheta, zile: [d.getUTCDate()] });
  }
  return grupuri.map(g => `${g.zile.join(", ")} ${g.luna}`).join(" · ");
}

// ---------- interfață
const $ = id => document.getElementById(id);
let tab = "sold", an = AN_AZI, luna = AZI.getUTCMonth() + 1, anIdei = AN_AZI, anPicker = an;

function toast(text) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}

// repornește o animație CSS pe un element
function anim(el, cls, ms = 450) {
  el.classList.remove("din-dreapta", "din-stanga", "intra"); void el.offsetWidth; el.classList.add(cls);
  clearTimeout(el._anim); el._anim = setTimeout(() => el.classList.remove(cls), ms);
}

function deseneazaAntet() {
  $("btnAn").textContent = `${LUNI[luna - 1].slice(0, 3)} ${an} ▾`;
  const s1 = sold(AN_AZI), s2 = sold(AN_AZI + 1);
  $("subtitlu").textContent = `Azi: ${ZILE_LUNG[AZI.getUTCDay()]}, ${AZI.getUTCDate()} ${LUNI[AZI.getUTCMonth()].toLowerCase()} ${AN_AZI}`;
  $("rezumat").innerHTML =
    `<div><b>${s1.ramase}</b><small>${s1.ramase === 1 ? "zi rămasă" : "zile rămase"} în ${AN_AZI}</small></div>` +
    `<div><b>${s2.ramase}</b><small>${s2.ramase === 1 ? "zi disponibilă" : "zile disponibile"} în ${AN_AZI + 1}</small></div>`;
}

function donut(s) {
  const r = 48, C = 2 * Math.PI * r, tot = Math.max(s.total, s.folosite + s.plan, 1);
  const seg = (val, start, cul) => val <= 0 ? "" :
    `<circle r="${r}" cx="60" cy="60" fill="none" stroke="${cul}" stroke-width="14" stroke-linecap="butt"
      stroke-dasharray="${C * val / tot} ${C}" stroke-dashoffset="${-C * start / tot}" transform="rotate(-90 60 60)"/>`;
  return `<svg viewBox="0 0 120 120" width="120" height="120">
    <circle r="${r}" cx="60" cy="60" fill="none" stroke="#EEF0FF" stroke-width="14"/>
    ${seg(s.folosite, 0, "#94D3CC")}${seg(s.plan, s.folosite, "#14B8A6")}
    ${seg(Math.max(0, s.ramase), s.folosite + s.plan, "#FF7A59")}
    <text x="60" y="64" text-anchor="middle" class="centru" ${s.ramase < 0 ? 'style="fill:#F43F5E"' : ""}>${s.ramase}</text>
    <text x="60" y="80" text-anchor="middle" class="sub">ZILE RĂMASE</text></svg>`;
}

function perioadePlanificate() {
  const k = Object.keys(date.zile).filter(x => x > K_AZI).sort();
  const grupuri = [];
  for (const x of k) {
    const d = dinCheie(x), g = grupuri[grupuri.length - 1];
    if (g) {   // aceeași perioadă dacă între ele sunt doar zile libere
      let p = adauga(g.e, 1); while (p < d && liber(p)) p = adauga(p, 1);
      if (cheie(p) === x) { g.e = d; g.n++; continue; }
    }
    grupuri.push({ s: d, e: d, n: 1 });
  }
  return grupuri.map(g => {
    let s = g.s, e = g.e;
    while (liber(adauga(s, -1))) s = adauga(s, -1);
    while (liber(adauga(e, 1))) e = adauga(e, 1);
    const total = Math.round((e - s) / ZI_MS) + 1;
    return `<div class="perioada"><b>${g.n === 1 ? fmtLung(g.s) : `${fmtLung(g.s)} – ${fmtLung(g.e)}`}</b>
      <small>${g.s.getUTCFullYear()} · ${zile(g.n)} de concediu → ${total === 1 ? "1 zi liberă" : `${total} zile libere`}</small>
      ${s < g.s || e > g.e ? `<small>Liber: ${fmtLung(s)} – ${fmtLung(e)}</small>` : ""}</div>`;
  }).join("");
}

// micșorează fontul rândurilor care nu încap pe o linie (fără să taie textul)
function potrivesteRanduri() {
  document.querySelectorAll(".perioada b, .perioada small").forEach(el => {
    el.style.fontSize = "";
    let f = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth && f > 9) { f -= 0.5; el.style.fontSize = f + "px"; }
  });
}

function deseneazaSold() {
  let html = "";
  for (const a of [AN_AZI, AN_AZI + 1]) {
    const s = sold(a), c = date.ani[a];
    html += `<div class="sec-title"><span>${a}</span><span>${a === AN_AZI ? "anul curent" : "anul următor"}</span></div>
      <div class="card">
      <div class="donut">${donut(s)}
        <div class="leg">
          <span><i style="background:#FF7A59"></i>Disponibile<b>${s.total}</b></span>
          <span><i style="background:#94D3CC"></i>Luate<b>${s.folosite}</b></span>
          <span><i style="background:#14B8A6"></i>Planificate<b>${s.plan}</b></span>
        </div></div>
      <div class="setare"><div>Zile alocate<small>conform contractului</small></div>
        <div class="stepper"><button data-an="${a}" data-camp="alocate" data-d="-1" aria-label="Mai puține">−</button><b>${c.alocate}</b><button data-an="${a}" data-camp="alocate" data-d="1" aria-label="Mai multe">+</button></div></div>
      <div class="setare"><div>Luate deja<small>zile luate, nemarcate în calendar</small></div>
        <div class="stepper"><button data-an="${a}" data-camp="luateInainte" data-d="-1" aria-label="Mai puține">−</button><b>${c.luateInainte}</b><button data-an="${a}" data-camp="luateInainte" data-d="1" aria-label="Mai multe">+</button></div></div>
      <div class="setare"><div>Report din ${a - 1}<small>${c.report ? (s.report ? `+${zile(s.report)} rămase neluate` : "nicio zi de reportat") : "dezactivat"}</small></div>
        <button class="comutator ${c.report ? "on" : ""}" data-report="${a}" aria-label="Report"></button></div>
      ${s.ramase < 0 ? `<div class="avert">⚠ Ai planificat cu ${zile(-s.ramase)} mai mult decât ai disponibil.</div>` : ""}
    </div>`;
  }
  const per = perioadePlanificate();
  html += `<div class="sec-title">Concedii planificate</div><div class="card">
    ${per || `<div class="gol-frumos"><div class="ico-mare">🏝️</div><b>Nimic planificat încă</b>
      <div class="chipuri"><button class="chip activ" data-mergi="idei">🌴 Vezi idei</button>
      <button class="chip" data-mergi="cal">📅 Calendar</button></div></div>`}</div>
    <div class="sec-title">Bine de știut</div>
    <div class="card"><div class="nota justificat" style="margin:0">ℹ️ Minimul legal în România este de 20 de zile lucrătoare pe an (Codul muncii, art. 145).
    Zilele neluate se pot efectua în următoarele 18 luni (art. 146), de aceea se pot reporta în anul următor.
    Zilele de concediu se numără doar în zile lucrătoare: weekendurile și sărbătorile legale nu se scad.</div></div>`;
  $("tab-sold").innerHTML = html;
  potrivesteRanduri();
}

function deseneazaCalendar() {
  $("titluLuna").textContent = `${LUNI[luna - 1]} ${an}`;
  const g = $("grila"); g.innerHTML = "";
  ["Luni", "Marți", "Miercuri", "Joi", "Vineri", "Sâmbătă", "Duminică"].forEach(n => { const h = document.createElement("div"); h.className = "cap"; h.textContent = n; g.appendChild(h); });
  const prima = D(an, luna, 1), nrZile = new Date(Date.UTC(an, luna, 0)).getUTCDate();
  for (let i = 0; i < (prima.getUTCDay() + 6) % 7; i++) { const e = document.createElement("div"); e.className = "zi goala"; g.appendChild(e); }
  for (let z = 1; z <= nrZile; z++) {
    const d = D(an, luna, z), k = cheie(d), el = document.createElement("div");
    let cls = "zi";
    if (numeSarb(k)) cls += " sarb"; else if (weekend(d)) cls += " we"; else if (date.zile[k]) cls += " co" + (k <= K_AZI ? " trecut" : "");
    if (k === K_AZI) cls += " azi";
    el.className = cls; el.textContent = z;
    el.onclick = () => clickZi(d);
    g.appendChild(el);
  }
  const lista = Object.entries(sarbatori(an)).filter(([k]) => +k.slice(5, 7) === luna).sort();
  $("titluSarbLuna").textContent = `Sărbători legale în ${LUNI[luna - 1].toLowerCase()}`;
  $("sarbLuna").innerHTML = lista.length ? lista.map(([k, n]) => {
    const d = dinCheie(k);
    return `<div>${n}<span>${fmt(d)}${weekend(d) ? " · weekend" : ""}</span></div>`;
  }).join("") : `<div class="gol" style="border:0">Nicio sărbătoare legală luna aceasta.</div>`;
}

function clickZi(d) {
  const k = cheie(d), text = `${ZILE_LUNG[d.getUTCDay()]}, ${d.getUTCDate()} ${LUNI[d.getUTCMonth()].toLowerCase()} ${d.getUTCFullYear()}`;
  const n = numeSarb(k);
  if (n) { $("info").innerHTML = `🎉 <b>${text}</b> — sărbătoare legală: ${n}`; return; }
  if (weekend(d)) { $("info").innerHTML = `😎 <b>${text}</b> — weekend, nu se scade din concediu`; return; }
  const a = d.getUTCFullYear();
  if (!date.ani[a]) date.ani[a] = { alocate: 21, luateInainte: 0, report: true };
  if (date.zile[k]) delete date.zile[k]; else date.zile[k] = "co";
  salveaza();
  const s = sold(a);
  $("info").innerHTML = date.zile[k]
    ? `🏖️ <b>${text}</b> — zi de concediu. Mai ai <b>${s.ramase}</b> ${s.ramase === 1 ? "zi" : "zile"} în ${a}.`
    : `<b>${text}</b> — zi lucrătoare. Mai ai <b>${s.ramase}</b> ${s.ramase === 1 ? "zi" : "zile"} în ${a}.`;
  if (s.ramase < 0) toast(`⚠ Depășești zilele disponibile în ${a} cu ${zile(-s.ramase)}`);
  deseneaza();
}

function deseneazaIdei() {
  $("chipuriIdei").innerHTML = [AN_AZI, AN_AZI + 1].map(a => `<button class="chip ${a === anIdei ? "activ" : ""}" data-an-idei="${a}">${a}</button>`).join("");
  const s = sold(anIdei), lista = idei(anIdei);
  $("notaIdei").innerHTML = `Ai <b>${s.ramase}</b> ${s.ramase === 1 ? "zi disponibilă" : "zile disponibile"} în ${anIdei}.`;
  if (!lista.length) { $("listaIdei").innerHTML = `<div class="card gol">Nu mai sunt sărbători legale în ${anIdei}.</div>`; return; }
  $("listaIdei").innerHTML = lista.map((v, i) => {
    const plan = v.co.length && v.co.every(k => date.zile[k]);
    let banda = "";
    for (let d = v.s; d <= v.e; d = adauga(d, 1)) {
      const k = cheie(d), cls = v.co.includes(k) ? "b-co" : numeSarb(k) ? "b-sarb" : "b-we";
      banda += `<div class="${cls}">${ZS[d.getUTCDay()]}<br>${d.getUTCDate()}</div>`;
    }
    const raport = v.co.length ? ` · ×${(v.total / v.co.length).toFixed(1).replace(".0", "")}` : "";
    return `<div class="idee ${v.co.length ? "" : "zero"} ${plan ? "planificat" : ""}">
      <div class="rand"><div><div class="idee-titlu">${v.nume.join(" + ")}</div>
        <div class="idee-per">${fmt(v.s)} – ${fmt(v.e)} ${v.e.getUTCFullYear()}${raport}</div></div>
        <div class="castig"><b>${v.total}</b><small>zile libere</small></div></div>
      <div class="banda">${banda}</div>
      <div class="idee-jos">${v.co.length
        ? `<span>Iei <b>${zile(v.co.length)}</b>: ${listaZile(v.co)}</span>
           <button data-idee="${i}">${plan ? "✓ Planificat" : "+ Planifică"}</button>`
        : `<span>🎉 Fără zile de concediu — weekend prelungit</span>`}</div>
    </div>`;
  }).join("");
  $("listaIdei").querySelectorAll("[data-idee]").forEach(b => b.onclick = () => {
    const v = lista[+b.dataset.idee], plan = v.co.every(k => date.zile[k]);
    for (const k of v.co) { if (plan) delete date.zile[k]; else date.zile[k] = "co"; }
    for (const k of v.co) { const a = +k.slice(0, 4); if (!date.ani[a]) date.ani[a] = { alocate: 21, luateInainte: 0, report: true }; }
    salveaza();
    const a = +v.co[0].slice(0, 4), s2 = sold(a);
    toast(plan ? "Planificare anulată" : s2.ramase < 0 ? `⚠ Planificat, dar depășești zilele din ${a} cu ${zile(-s2.ramase)}` : `🏖️ Planificat! Mai ai ${zile(s2.ramase)} în ${a}`);
    deseneaza();
  });
}

function deseneaza() {
  deseneazaAntet();
  if (tab === "sold") deseneazaSold();
  if (tab === "cal") deseneazaCalendar();
  if (tab === "idei") deseneazaIdei();
  initSegs();
}

function arataTab(t) {
  tab = t;
  for (const id of ["sold", "cal", "idei"]) $("tab-" + id).hidden = id !== t;
  document.querySelectorAll("#segTab button").forEach(b => { const on = b.dataset.tab === t; b.classList.toggle("activ", on); b.classList.toggle("on", on); });
  window.scrollTo(0, 0);
  deseneaza();
  anim($("tab-" + t), "intra", 700);
}

// ---------- alegere lună / an (fereastră de jos; fundalul NU o închide — doar „Renunță” / „Gata”)
function deschidePicker() {
  const p = $("picker"); clearTimeout(p._t); p.classList.remove("pleaca");
  anPicker = an; deseneazaPicker(); p.hidden = false;
}
function inchidePicker() {
  const p = $("picker"); if (p.hidden || p.classList.contains("pleaca")) return;
  p.classList.add("pleaca");
  p._t = setTimeout(() => { p.hidden = true; p.classList.remove("pleaca"); }, 220);
}
function deseneazaPicker() {
  $("pickAn").textContent = anPicker;
  $("pickLuni").innerHTML = LUNI.map((n, i) => {
    const m = i + 1, nr = Object.keys(date.zile).filter(k => +k.slice(0, 4) === anPicker && +k.slice(5, 7) === m).length;
    const cls = (anPicker === an && m === luna ? "sel " : "") + (anPicker === AN_AZI && m === AZI.getUTCMonth() + 1 ? "curenta" : "");
    return `<button class="${cls}" data-luna="${m}">${n.slice(0, 3)}${nr ? `<em>${nr}</em>` : ""}</button>`;
  }).join("");
}
function mergiLa(a, l) { an = a; luna = l; inchidePicker(); arataTab("cal"); }
function mergiAzi() { mergiLa(AN_AZI, AZI.getUTCMonth() + 1); }
function mutaLuna(d) { luna += d; if (luna < 1) { luna = 12; an--; } else if (luna > 12) { luna = 1; an++; } deseneaza(); anim($("grila"), d > 0 ? "din-dreapta" : "din-stanga"); }

$("btnAn").onclick = deschidePicker;
$("titluLuna").onclick = deschidePicker;
$("pickInapoi").onclick = () => { anPicker--; deseneazaPicker(); anim($("pickLuni"), "din-stanga"); };
$("pickInainte").onclick = () => { anPicker++; deseneazaPicker(); anim($("pickLuni"), "din-dreapta"); };
$("pickLuni").onclick = e => { const b = e.target.closest("[data-luna]"); if (b) mergiLa(anPicker, +b.dataset.luna); };
$("pickAzi").onclick = mergiAzi;
$("pickRenunta").onclick = inchidePicker;
$("pickGata").onclick = () => mergiLa(anPicker, luna);   // aceeași lună, în anul ales
$("btnAzi").onclick = mergiAzi;
$("lunaInapoi").onclick = () => mutaLuna(-1);
$("lunaInainte").onclick = () => mutaLuna(1);
$("segTab").onclick = e => { const b = e.target.closest("[data-tab]"); if (b && b.dataset.tab !== tab) arataTab(b.dataset.tab); };

$("tab-sold").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.mergi) return arataTab(b.dataset.mergi);
  if (b.dataset.camp) {
    const c = date.ani[b.dataset.an];
    c[b.dataset.camp] = Math.max(0, Math.min(60, c[b.dataset.camp] + +b.dataset.d));
  } else if (b.dataset.report) {
    const c = date.ani[b.dataset.report]; c.report = !c.report;
  } else return;
  salveaza(); deseneaza();
};
$("chipuriIdei").onclick = e => { const b = e.target.closest("[data-an-idei]"); if (b) { anIdei = +b.dataset.anIdei; deseneazaIdei(); initSegs(); } };

// ---------- butoane segmentate (ca în MindMe): bulă care alunecă; tragi cu degetul de-a lungul lor,
// butonul de sub deget crește (lupă), iar la ridicarea degetului se alege
const segPos = {};
const setSegPill = (p, pos) => { p.style.width = pos.width + "px"; p.style.transform = `translateX(${pos.left}px)`; };
const segBtns = seg => [...seg.querySelectorAll(":scope > button")];
function initSegs() {
  document.querySelectorAll(".seg").forEach(seg => {
    let pill = seg.querySelector(":scope > .segpill");
    if (!pill) { pill = document.createElement("span"); pill.className = "segpill"; seg.prepend(pill); }
    const on = seg.querySelector(":scope > button.on, :scope > button.activ");
    if (!on || !on.offsetWidth) { pill.style.opacity = on ? "" : "0"; return; }
    pill.style.opacity = "";
    const to = { left: on.offsetLeft, width: on.offsetWidth }, from = segPos[seg.id];
    const aluneca = from && (from.left !== to.left || from.width !== to.width);
    seg.classList.add("noanim");
    setSegPill(pill, aluneca ? from : to);
    void pill.offsetWidth;
    seg.classList.remove("noanim");
    if (aluneca) setSegPill(pill, to);   // după reflow → tranziția pornește din poziția veche
    segPos[seg.id] = to;
  });
}
function magnify(buttons, x, maxScale, reach) {
  buttons.forEach(b => {
    const r = b.getBoundingClientRect();
    const k = Math.max(0, 1 - Math.abs(x - (r.left + r.width / 2)) / (r.width * reach));
    const s = 1 + (maxScale - 1) * k * k * (3 - 2 * k);   // curbă lină
    b.style.transform = s > 1.001 ? `scale(${s.toFixed(3)}) translateY(${(-(s - 1) * 14).toFixed(1)}px)` : "";
  });
}
let segDrag = null, segFaraClick = false;
document.addEventListener("pointerdown", ev => {
  const seg = ev.target.closest(".seg");
  if (!seg || ev.button > 0) return;
  segDrag = { seg, id: ev.pointerId, x: ev.clientX, moved: false, over: null, left: 0, width: 0 };
});
document.addEventListener("pointermove", ev => {
  if (!segDrag || ev.pointerId !== segDrag.id) return;
  const { seg } = segDrag;
  if (!segDrag.moved && Math.abs(ev.clientX - segDrag.x) < 7) return;
  segDrag.moved = true;
  seg.classList.add("dragging");
  const btns = segBtns(seg), sr = seg.getBoundingClientRect();
  const over = btns.find(b => { const r = b.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX < r.right; })
    || (ev.clientX < sr.left + sr.width / 2 ? btns[0] : btns[btns.length - 1]);
  if (over !== segDrag.over) { segDrag.over = over; try { navigator.vibrate && navigator.vibrate(6); } catch (e) { /* ignorat */ } }
  btns.forEach(b => b.classList.toggle("over", b === over));
  magnify(btns, ev.clientX, 1.12, 1.1);
  const w = over.offsetWidth;
  const left = Math.max(2, Math.min(seg.offsetWidth - w - 2, ev.clientX - sr.left - w / 2));
  segDrag.left = left; segDrag.width = w;
  const pill = seg.querySelector(":scope > .segpill");
  if (pill) setSegPill(pill, { left, width: w });
});
function endSegDrag(ev) {
  if (!segDrag || (ev && ev.pointerId !== segDrag.id)) return;
  const d = segDrag; segDrag = null;
  d.seg.classList.remove("dragging");
  segBtns(d.seg).forEach(b => { b.classList.remove("over"); b.style.transform = ""; });
  if (!d.moved || !d.over) return;
  segPos[d.seg.id] = { left: d.left, width: d.width };   // bula pleacă de unde era degetul
  if (d.over.classList.contains("on") || d.over.classList.contains("activ")) initSegs();
  else d.over.click();
  segFaraClick = true;   // clicul nativ de după tragere nu mai contează
  setTimeout(() => { segFaraClick = false; }, 350);
}
document.addEventListener("pointerup", endSegDrag);
document.addEventListener("pointercancel", endSegDrag);
document.addEventListener("click", e => { if (segFaraClick && e.target.closest && e.target.closest(".seg")) { e.stopPropagation(); e.preventDefault(); } }, true);
window.addEventListener("resize", () => { for (const k in segPos) delete segPos[k]; initSegs(); });

// glisare pe calendar
let x0 = null;
$("grila").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
$("grila").addEventListener("touchend", e => {
  if (x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if (Math.abs(dx) > 60) mutaLuna(dx < 0 ? 1 : -1);
});

// butonul „înapoi” de pe Android (apelat din aplicația nativă)
window.inapoi = () => {
  if (!$("picker").hidden) { inchidePicker(); return true; }
  if (tab !== "sold") { arataTab("sold"); return true; }
  return false;
};
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") salveaza(); });
window.addEventListener("pagehide", salveaza);
window.addEventListener("resize", potrivesteRanduri);
// fără zoom cu degetele (Safari pe iPhone ignoră user-scalable=no)
for (const ev of ["gesturestart", "gesturechange"]) document.addEventListener(ev, e => e.preventDefault());
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
if ("serviceWorker" in navigator && location.protocol === "https:") /* offline: handled by MindMe sw.js */ void 0;

salveaza();
deseneaza();
</script>
</body>
