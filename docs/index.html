<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <script>
    // theme + iPhone status bar: dark → the app paints under the clock/Dynamic Island itself (white clock);
    // light → the system bar with dark clock. iOS reads this when the app starts.
    (function(){var t=null;try{t=localStorage.getItem("mindme.theme");}catch(e){}
      if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);
      var dark=t==="dark"||(t!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
      var m=function(n,c){var x=document.createElement("meta");x.name=n;x.content=c;document.head.appendChild(x);};
      m("apple-mobile-web-app-status-bar-style",dark?"black-translucent":"default");
      m("theme-color",dark?"#000000":"#F2F2F7");})();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>MindMe</title>
  <meta name="description" content="Notițe, comenzi, plăți și remindere – bifate.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MindMe">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="fixhead"></div>
  <div id="app"></div>
  <nav id="tabbar"></nav>
  <div id="sheet"></div>
  <div id="toast"></div>
  <div id="rotate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7.5" y="3" width="9" height="18" rx="2.2"/><path d="M10.8 18h2.4M3 9.5a9 9 0 0 1 3-5M3 4.5v5h5"/></svg>Ține telefonul vertical</div>
  <script src="catalog.js"></script>
  <script src="trips.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
